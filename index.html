<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <title>SCMv2</title>
    <script>
      // Default to light theme. Dark mode applies ONLY when the user
      // explicitly picks "Gelap" in the profile dialog (stored theme).
      // The OS color-scheme is intentionally ignored: the dark variant is
      // not fully styled and produced a broken-looking UI on dark-mode phones.
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
